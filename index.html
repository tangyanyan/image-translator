<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片英文识别翻译工具</title>
    <style>
        /* shadcn Dark Theme Variables */
        :root {
            --background: 0 0% 3.9%;
            --foreground: 0 0% 98%;
            --card: 0 0% 3.9%;
            --card-foreground: 0 0% 98%;
            --popover: 0 0% 3.9%;
            --popover-foreground: 0 0% 98%;
            --primary: 0 0% 98%;
            --primary-foreground: 0 0% 9%;
            --secondary: 0 0% 14.9%;
            --secondary-foreground: 0 0% 98%;
            --muted: 0 0% 14.9%;
            --muted-foreground: 0 0% 63.9%;
            --accent: 0 0% 14.9%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 0 0% 98%;
            --border: 0 0% 14.9%;
            --input: 0 0% 14.9%;
            --ring: 0 0% 83.1%;
            --radius: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            min-height: 100vh;
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .header p {
            color: hsl(var(--muted-foreground));
            font-size: 14px;
        }

        /* Cards */
        .card {
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            color: hsl(var(--muted-foreground));
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed hsl(var(--border));
            border-radius: var(--radius);
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: hsl(var(--card));
        }

        .upload-area:hover {
            border-color: hsl(var(--ring));
            background: hsl(var(--accent));
        }

        .upload-area.drag-over {
            border-color: hsl(var(--ring));
            background: hsl(var(--accent));
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            opacity: 0.5;
        }

        .upload-text {
            color: hsl(var(--muted-foreground));
            font-size: 14px;
            margin-bottom: 8px;
        }

        .upload-text strong {
            color: hsl(var(--foreground));
            font-weight: 500;
        }

        .upload-hint {
            color: hsl(var(--muted-foreground));
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        /* Images Grid */
        .images-container {
            display: none;
            margin-bottom: 24px;
        }

        .images-container.has-images {
            display: block;
        }

        .images-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .image-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid hsl(var(--border));
            cursor: pointer;
            transition: all 0.2s;
        }

        .image-item:hover {
            border-color: hsl(var(--ring));
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: hsl(var(--destructive));
            color: hsl(var(--destructive-foreground));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-item:hover .remove-btn {
            opacity: 1;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }

        .btn-primary:hover:not(:disabled) {
            background: hsl(var(--primary) / 0.9);
        }

        .btn-secondary {
            background: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
        }

        .btn-secondary:hover:not(:disabled) {
            background: hsl(var(--secondary) / 0.8);
        }

        .btn-destructive {
            background: hsl(var(--destructive));
            color: hsl(var(--destructive-foreground));
        }

        .btn-destructive:hover:not(:disabled) {
            background: hsl(var(--destructive) / 0.9);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid hsl(var(--border));
            color: hsl(var(--foreground));
        }

        .btn-outline:hover:not(:disabled) {
            background: hsl(var(--accent));
        }

        .btn-green {
            background: hsl(142 76% 36%);
            color: white;
        }

        .btn-green:hover:not(:disabled) {
            background: hsl(142 76% 30%);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-buttons-center {
            justify-content: center;
        }

        .entries-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Progress */
        .progress-container {
            display: none;
            margin-bottom: 24px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: hsl(var(--secondary));
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: hsl(var(--primary));
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: hsl(var(--muted-foreground));
            font-size: 14px;
        }

        /* Table */
        .entries-container {
            display: none;
        }

        .entries-container.has-entries {
            display: block;
        }

        .entries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .entries-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .entries-title .entries-count {
            background: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }

        .entries-count {
            background: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }

        .entries-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        .entries-table th {
            background: hsl(var(--secondary));
            padding: 12px 16px;
            text-align: left;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: hsl(var(--muted-foreground));
            border-bottom: 1px solid hsl(var(--border));
        }

        .entries-table td {
            padding: 12px 16px;
            border-bottom: 1px solid hsl(var(--border));
            vertical-align: top;
        }

        .entries-table tr:hover {
            background: hsl(var(--accent) / 0.5);
        }

        .entries-table .col-index {
            width: 60px;
            text-align: center;
            color: hsl(var(--muted-foreground));
            font-size: 12px;
        }

        .entries-table .col-english,
        .entries-table .col-chinese {
            width: 45%;
        }

        .entries-table .col-action {
            width: 60px;
            text-align: center;
        }

        .entries-table textarea {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            border-radius: calc(var(--radius) - 2px);
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 40px;
            color: hsl(var(--foreground));
            transition: all 0.2s;
        }

        .entries-table textarea:hover {
            background: hsl(var(--secondary));
        }

        .entries-table textarea:focus {
            outline: none;
            border-color: hsl(var(--ring));
            background: hsl(var(--secondary));
        }

        .delete-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: hsl(var(--muted-foreground));
            cursor: pointer;
            border-radius: calc(var(--radius) - 2px);
            font-size: 16px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: hsl(var(--destructive));
            color: hsl(var(--destructive-foreground));
        }

        /* PDF Settings */
        .pdf-settings {
            background: hsl(var(--secondary));
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-item label {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
        }

        .setting-item select {
            padding: 6px 12px;
            background: hsl(var(--background));
            border: 1px solid hsl(var(--border));
            border-radius: calc(var(--radius) - 2px);
            font-size: 14px;
            color: hsl(var(--foreground));
            cursor: pointer;
        }

        .setting-item select:focus {
            outline: none;
            border-color: hsl(var(--ring));
        }

        /* PDF Actions */
        .pdf-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: hsl(var(--background) / 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50% -12px hsl(var(--background) / 0.5);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid hsl(var(--border));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
            color: hsl(var(--muted-foreground));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: hsl(var(--secondary));
            color: hsl(var(--foreground));
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid hsl(var(--border));
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* PDF Preview */
        .pdf-preview {
            background: hsl(var(--secondary));
            border-radius: var(--radius);
            padding: 32px;
        }

        .pdf-preview-page {
            background: white;
            padding: 40px;
            border-radius: calc(var(--radius) - 2px);
            margin-bottom: 20px;
            color: #000;
        }

        .pdf-preview-page:last-child {
            margin-bottom: 0;
        }

        .pdf-preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12pt;
        }

        .pdf-preview-table td {
            padding: 8px;
            border: 1px solid #F1F1F1;
            vertical-align: top;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: hsl(var(--muted-foreground));
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 16px;
            }

            .entries-table th,
            .entries-table td {
                padding: 8px;
            }

            .pdf-settings {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>图片英文识别翻译工具</h1>
            <p>上传图片 → 识别英文 → 翻译中文 → 生成PDF</p>
        </div>

        <!-- Upload Card -->
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p class="upload-text"><strong>点击选择</strong> 或拖拽图片到此处</p>
                <p class="upload-hint">支持 JPG、PNG、WEBP、GIF 格式</p>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>

            <!-- Image Preview -->
            <div class="images-container" id="imagesContainer" style="margin-top: 16px;">
                <div class="card-title" style="text-align: center;">已上传图片</div>
                <div class="images-grid" id="imagesGrid"></div>
            </div>
        </div>

        <!-- Progress -->
        <div class="card progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">正在识别...</p>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons action-buttons-center" style="margin-bottom: 24px;">
            <button class="btn btn-green" id="recognizeBtn" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
                识别并翻译
            </button>
        </div>

        <!-- Entries Table -->
        <div class="entries-container card" id="entriesContainer">
            <div class="entries-header">
                <div class="entries-title">识别结果 <span class="entries-count">共 <span id="entryCount">0</span> 条</span></div>
                <div class="entries-actions">
                    <button class="btn btn-secondary" id="addEntryBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        手动添加条目
                    </button>
                    <button class="btn btn-outline" id="clearAllBtn" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                        清空全部
                    </button>
                </div>
            </div>
            <table class="entries-table">
                <thead>
                    <tr>
                        <th class="col-index">序号</th>
                        <th class="col-english">英文</th>
                        <th class="col-chinese">中文</th>
                        <th class="col-action">操作</th>
                    </tr>
                </thead>
                <tbody id="entriesBody"></tbody>
            </table>

            <!-- PDF Settings -->
            <div class="pdf-settings">
                <div class="setting-item">
                    <label>字号：</label>
                    <select id="fontSize">
                        <option value="10">小 (10pt)</option>
                        <option value="12" selected>中 (12pt)</option>
                        <option value="14">大 (14pt)</option>
                        <option value="16">特大 (16pt)</option>
                    </select>
                </div>
            </div>

            <!-- PDF Actions -->
            <div class="pdf-actions" style="justify-content: center;">
                <button class="btn btn-outline" id="previewBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    PDF 预览
                </button>
                <button class="btn btn-primary" id="downloadBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </svg>
                    打印/导出PDF
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📝</div>
            <p class="empty-state-text">上传图片开始识别，或手动添加条目</p>
        </div>
    </div>

    <!-- PDF Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal">
            <div class="modal-header">
                <h2>PDF 预览</h2>
                <button class="modal-close" id="closePreview">×</button>
            </div>
            <div class="modal-body">
                <div class="pdf-preview" id="pdfPreview"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="closePreviewBtn">关闭</button>
                <button class="btn btn-primary" id="downloadFromPreview">
                    打印/导出PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        const state = {
            images: [],
            entries: [],
            isProcessing: false
        };

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const imagesContainer = document.getElementById('imagesContainer');
        const imagesGrid = document.getElementById('imagesGrid');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const addEntryBtn = document.getElementById('addEntryBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const entriesContainer = document.getElementById('entriesContainer');
        const entriesBody = document.getElementById('entriesBody');
        const entryCount = document.getElementById('entryCount');
        const emptyState = document.getElementById('emptyState');
        const previewBtn = document.getElementById('previewBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewModal = document.getElementById('previewModal');
        const closePreview = document.getElementById('closePreview');
        const closePreviewBtn = document.getElementById('closePreviewBtn');
        const downloadFromPreview = document.getElementById('downloadFromPreview');
        const pdfPreview = document.getElementById('pdfPreview');
        const fontSize = document.getElementById('fontSize');

        // File Upload
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        function handleFiles(files) {
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.images.push({
                        id: Date.now() + Math.random(),
                        file: file,
                        dataUrl: e.target.result
                    });
                    renderImages();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderImages() {
            imagesGrid.innerHTML = '';
            state.images.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'image-item';
                div.innerHTML = `
                    <img src="${img.dataUrl}" alt="图片${index + 1}">
                    <button class="remove-btn" data-index="${index}">×</button>
                `;
                div.querySelector('.remove-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    state.images.splice(index, 1);
                    renderImages();
                });
                imagesGrid.appendChild(div);
            });

            imagesContainer.classList.toggle('has-images', state.images.length > 0);
            recognizeBtn.disabled = state.images.length === 0;
        }

        // Preprocess image for better OCR
        function preprocessImage(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Scale up for better recognition
                    const scale = Math.min(4, Math.max(2, 3000 / Math.max(img.width, img.height)));
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    
                    // Enable image smoothing for better scaling
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Get image data
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // Convert to grayscale with higher contrast for handwriting
                    for (let i = 0; i < data.length; i += 4) {
                        // Grayscale
                        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        // Higher contrast for handwriting
                        const contrast = ((gray - 128) * 2.0) + 128;
                        // Thresholding for cleaner text
                        const value = gray < 128 ? Math.max(0, contrast * 0.8) : Math.min(255, contrast * 1.2);
                        data[i] = value;
                        data[i + 1] = value;
                        data[i + 2] = value;
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png', 1.0));
                };
                img.src = dataUrl;
            });
        }

        // Check if text is valid English
        function isValidEnglish(text) {
            if (!text || text.length < 2) return false;
            // Check if contains at least some English letters
            const letterCount = (text.match(/[a-zA-Z]/g) || []).length;
            // At least 30% should be letters, allow more special chars for handwriting
            return letterCount / text.length > 0.3;
        }

        // Baidu OCR Configuration
        const BAIDU_API_KEY = '7pm7FhVzc4N1sBEykfmX67l9';
        const BAIDU_SECRET_KEY = 'J2wHfvrZ09RKcOlnGdGcZvW0Um05hKs1';

        // Get Baidu Access Token
        let baiduAccessToken = null;
        async function getBaiduAccessToken() {
            if (baiduAccessToken) return baiduAccessToken;

            try {
                const response = await fetch(
                    `https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${BAIDU_API_KEY}&client_secret=${BAIDU_SECRET_KEY}`
                );
                const data = await response.json();
                if (data.access_token) {
                    baiduAccessToken = data.access_token;
                    // Token expires in 30 days, but we'll refresh it
                    setTimeout(() => { baiduAccessToken = null; }, 29 * 24 * 60 * 60 * 1000);
                    return baiduAccessToken;
                }
                console.error('Baidu Token Error:', data);
            } catch (error) {
                console.error('Baidu Token Error:', error);
            }
            return null;
        }

        // OCR using Baidu API (High Accuracy)
        async function recognizeWithBaidu(imageDataUrl) {
            try {
                const accessToken = await getBaiduAccessToken();
                if (!accessToken) {
                    alert('百度 OCR 认证失败，请检查 API Key 配置。');
                    return null;
                }

                const base64 = imageDataUrl.split(',')[1];

                const response = await fetch(
                    `https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic?access_token=${accessToken}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: `image=${encodeURIComponent(base64)}`
                    }
                );

                const data = await response.json();

                if (data.error_code) {
                    console.error('Baidu OCR Error:', data);
                    if (data.error_code === 18 || data.error_code === 19) {
                        alert('百度 OCR QPS 超限，请稍后再试。');
                    } else if (data.error_code === 17) {
                        alert('百度 OCR 每日请求次数超限。');
                    } else {
                        alert(`识别失败：${data.error_msg}`);
                    }
                    return null;
                }

                if (data.words_result && data.words_result.length > 0) {
                    return data.words_result.map(item => item.words).join('\n');
                }
            } catch (error) {
                console.error('Baidu OCR Error:', error);
                alert('识别失败，请检查网络连接后重试。');
            }
            return null;
        }

        // OCR Recognition
        recognizeBtn.addEventListener('click', async () => {
            if (state.isProcessing || state.images.length === 0) return;

            state.isProcessing = true;
            recognizeBtn.disabled = true;
            progressContainer.classList.add('active');

            const allTexts = [];
            let hasError = false;

            for (let i = 0; i < state.images.length; i++) {
                const img = state.images[i];

                progressText.textContent = `正在识别第 ${i + 1}/${state.images.length} 张图片...`;
                progressFill.style.width = `${(i / state.images.length) * 60}%`;

                const recognizedText = await recognizeWithBaidu(img.dataUrl);

                if (recognizedText === null) {
                    hasError = true;
                    progressText.textContent = `第 ${i + 1} 张图片识别失败，继续...`;
                } else {
                    // Filter and clean text
                    const lines = recognizedText
                        .split('\n')
                        .map(line => line.trim())
                        .filter(line => isValidEnglish(line))
                        .map(line => {
                            // Remove leading numbers and dots (e.g., "1.", "2.", "12.", "1)", "2)")
                            line = line.replace(/^[\d]+[\.\)\、\:\：\s]+/, '');
                            // Remove leading bullets or dashes
                            line = line.replace(/^[\•\-\*\–\—\·\s]+/, '');
                            // Clean up extra spaces
                            return line.replace(/\s+/g, ' ').trim();
                        })
                        .filter(line => line.length > 1); // Remove empty lines

                    allTexts.push(...lines);
                }

                progressFill.style.width = `${((i + 1) / state.images.length) * 70}%`;
            }

            if (allTexts.length === 0) {
                progressText.textContent = hasError ? '识别失败，请检查网络或稍后重试' : '未识别到有效文本';
                setTimeout(() => {
                    progressContainer.classList.remove('active');
                    state.isProcessing = false;
                    recognizeBtn.disabled = state.images.length === 0;
                }, 2000);
                return;
            }

            progressText.textContent = '正在翻译...';
            progressFill.style.width = '90%';

            // Translate each text
            for (let i = 0; i < allTexts.length; i++) {
                const text = allTexts[i];
                progressText.textContent = `正在翻译第 ${i + 1}/${allTexts.length} 条...`;
                const chinese = await translateText(text);
                state.entries.push({
                    id: Date.now() + i,
                    english: text,
                    chinese: chinese
                });
                progressFill.style.width = `${90 + (i / allTexts.length) * 10}%`;
            }

            progressFill.style.width = '100%';
            progressText.textContent = '完成！';

            setTimeout(() => {
                progressContainer.classList.remove('active');
                state.isProcessing = false;
                recognizeBtn.disabled = state.images.length === 0;
            }, 500);

            renderEntries();
        });

        // Detect if text is Chinese
        function isChineseText(text) {
            const chinesePattern = /[\u4e00-\u9fa5]/;
            const chineseCount = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            return chineseCount / text.length > 0.3;
        }

        // Translation using MyMemory API (no CORS issues in browser)
        async function translateText(text, fromLang = 'en', toLang = 'zh') {
            if (!text || text.trim().length === 0) {
                return '';
            }

            try {
                // MyMemory uses zh-CN for Chinese
                const targetLang = toLang === 'zh' ? 'zh-CN' : toLang;
                const langPair = `${fromLang}|${targetLang}`;
                
                const response = await fetch(
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`
                );
                const data = await response.json();
                
                if (data.responseStatus === 200 && data.responseData?.translatedText) {
                    return data.responseData.translatedText;
                }
                
                console.error('Translation API Error:', data);
            } catch (e) {
                console.error('Translation API error:', e);
            }
            return '[请手动翻译]';
        }

        // Auto translate based on input language
        async function autoTranslate(entry, field, text) {
            if (!text || text.trim().length < 2) return;
            
            // Debounce translation
            if (entry.translateTimeout) {
                clearTimeout(entry.translateTimeout);
            }
            
            entry.translateTimeout = setTimeout(async () => {
                if (field === 'english' && !isChineseText(text)) {
                    // Input English, translate to Chinese
                    const chinese = await translateText(text, 'en', 'zh-CN');
                    entry.chinese = chinese;
                    renderEntries();
                } else if (field === 'chinese' && isChineseText(text)) {
                    // Input Chinese, translate to English
                    const english = await translateText(text, 'zh-CN', 'en');
                    entry.english = english;
                    renderEntries();
                }
            }, 800); // 800ms debounce
        }

        // Add Entry Manually
        addEntryBtn.addEventListener('click', () => {
            state.entries.push({
                id: Date.now(),
                english: '',
                chinese: ''
            });
            renderEntries();
        });

        // Clear All
        clearAllBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有条目吗？')) {
                state.entries = [];
                state.images = [];
                renderImages();
                renderEntries();
            }
        });

        // Render Entries
        function renderEntries() {
            entriesBody.innerHTML = '';
            
            state.entries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-index">${index + 1}</td>
                    <td class="col-english">
                        <textarea data-id="${entry.id}" data-field="english" rows="1">${entry.english}</textarea>
                    </td>
                    <td class="col-chinese">
                        <textarea data-id="${entry.id}" data-field="chinese" rows="1">${entry.chinese}</textarea>
                    </td>
                    <td class="col-action">
                        <button class="delete-btn" data-id="${entry.id}">×</button>
                    </td>
                `;
                
                // Auto-resize textarea and auto-translate
                const textareas = tr.querySelectorAll('textarea');
                textareas.forEach(textarea => {
                    textarea.addEventListener('input', (e) => {
                        const id = parseFloat(e.target.dataset.id);
                        const field = e.target.dataset.field;
                        const entry = state.entries.find(en => en.id === id);
                        if (entry) {
                            entry[field] = e.target.value;
                            // Auto translate
                            autoTranslate(entry, field, e.target.value);
                        }
                        // Auto resize
                        e.target.style.height = 'auto';
                        e.target.style.height = e.target.scrollHeight + 'px';
                    });
                    // Initial resize
                    setTimeout(() => {
                        textarea.style.height = 'auto';
                        textarea.style.height = textarea.scrollHeight + 'px';
                    }, 0);
                });
                
                tr.querySelector('.delete-btn').addEventListener('click', (e) => {
                    const id = parseFloat(e.target.dataset.id);
                    state.entries = state.entries.filter(en => en.id !== id);
                    renderEntries();
                });
                
                entriesBody.appendChild(tr);
            });

            entryCount.textContent = state.entries.length;
            entriesContainer.classList.toggle('has-entries', state.entries.length > 0);
            emptyState.style.display = state.entries.length > 0 ? 'none' : 'block';
            clearAllBtn.style.display = state.entries.length > 0 ? 'flex' : 'none';
        }

        // PDF Preview
        previewBtn.addEventListener('click', () => {
            generatePreview();
            previewModal.classList.add('active');
        });

        closePreview.addEventListener('click', () => {
            previewModal.classList.remove('active');
        });

        closePreviewBtn.addEventListener('click', () => {
            previewModal.classList.remove('active');
        });

        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                previewModal.classList.remove('active');
            }
        });

        function generatePreview() {
            const fontSizeVal = parseInt(fontSize.value);
            
            let html = `
                <div class="pdf-preview-page">
                    <table class="pdf-preview-table" style="font-size: ${fontSizeVal}pt;">
                        <tbody>
                            ${state.entries.map((entry, i) => `
                                <tr>
                                    <td class="col-english">${escapeHtml(entry.english)}</td>
                                    <td class="col-chinese">${escapeHtml(entry.chinese)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            pdfPreview.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Download PDF
        downloadBtn.addEventListener('click', generatePDF);
        downloadFromPreview.addEventListener('click', () => {
            generatePDF();
            previewModal.classList.remove('active');
        });

        async function generatePDF() {
            const fontSizeVal = parseInt(fontSize.value);
            
            // Build print HTML content - auto pagination based on content
            let printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>翻译对照表</title>
                    <style>
                        @page {
                            size: A4;
                            margin: 15mm;
                        }
                        * {
                            margin: 0;
                            padding: 0;
                            box-sizing: border-box;
                        }
                        body {
                            font-family: 'Microsoft YaHei', 'SimSun', 'PingFang SC', sans-serif;
                            font-size: ${fontSizeVal}pt;
                            line-height: 1.6;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                        }
                        tr {
                            page-break-inside: avoid;
                        }
                        td {
                            width: 50%;
                            border: 1px solid #F1F1F1;
                            padding: 8px 10px;
                            vertical-align: top;
                            word-wrap: break-word;
                            white-space: pre-wrap;
                        }
                        @media print {
                            tr {
                                page-break-inside: avoid;
                            }
                        }
                    </style>
                </head>
                <body>
                    <table>
            `;
            
            state.entries.forEach(entry => {
                printContent += `
                    <tr>
                        <td>${escapeHtml(entry.english || '')}</td>
                        <td>${escapeHtml(entry.chinese || '')}</td>
                    </tr>
                `;
            });
            
            printContent += `
                    </table>
                </body>
                </html>
            `;
            
            // Open print preview in new window
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent);
            printWindow.document.close();
            
            // Wait for content to load then trigger print dialog
            printWindow.onload = function() {
                printWindow.print();
            };
        }

        // Initialize
        renderEntries();
    </script>
</body>
